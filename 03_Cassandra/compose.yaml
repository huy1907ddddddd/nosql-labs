name: nosql-lab03
x-cassandra: &cassandra
  image: cassandra:5.0.6
  environment:
    CASSANDRA_CLUSTER_NAME: sensorring_lab03
    CASSANDRA_SEEDS: cass1
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck:
    test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 60s
services:
  cass1:
    <<: *cassandra
    ports: ["127.0.0.1:9142:9042"]
    volumes: ["cass1-data:/var/lib/cassandra"]
  cass2:
    <<: *cassandra
    depends_on:
      cass1: {condition: service_healthy}
    volumes: ["cass2-data:/var/lib/cassandra"]
  cass3:
    <<: *cassandra
    depends_on:
      cass2: {condition: service_healthy}
    volumes: ["cass3-data:/var/lib/cassandra"]
volumes:
  cass1-data:
  cass2-data:
  cass3-data:
